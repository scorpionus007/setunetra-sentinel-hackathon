<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 910" font-family="Segoe UI, Inter, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#5B6372"/>
    </marker>
    <style>
      .tier{font-size:13px;font-weight:700;letter-spacing:2px;fill:#FF9933}
      .box{fill:#FBFAF6;stroke:#E2DFD2;stroke-width:1.5}
      .h{font-size:15px;font-weight:700;fill:#12213F}
      .s{font-size:12px;fill:#5B6372}
      .w{fill:#FFFFFF}
      .flow{stroke:#5B6372;stroke-width:2;fill:none}
    </style>
  </defs>

  <rect width="1240" height="910" fill="#FFFFFF"/>
  <!-- tricolour bar -->
  <rect x="0" y="0" width="413.3" height="8" fill="#FF9933"/>
  <rect x="413.3" y="0" width="413.3" height="8" fill="#FFFFFF"/>
  <rect x="826.6" y="0" width="413.4" height="8" fill="#138808"/>

  <text x="40" y="52" font-size="28" font-weight="800" fill="#10214B">SetuNetra — Workflow &amp; Integration</text>
  <text x="40" y="78" font-size="14" fill="#5B6372">Heterogeneous CCTV &amp; VMS unified into one command grid — deterministic, no ML in the critical path</text>

  <!-- ================= SOURCES ================= -->
  <text x="40" y="118" class="tier">SOURCES</text>
  <rect x="180" y="128" width="470" height="86" rx="12" class="box"/>
  <rect x="180" y="128" width="6" height="86" rx="3" fill="#FF9933"/>
  <text x="205" y="162" class="h">RTSP / ONVIF Cameras</text>
  <text x="205" y="186" class="s">Credential-authenticated live streams (email + access</text>
  <text x="205" y="203" class="s">password in URL, forced TCP) · cam01…camNN</text>

  <rect x="700" y="128" width="520" height="86" rx="12" class="box"/>
  <rect x="700" y="128" width="6" height="86" rx="3" fill="#138808"/>
  <text x="725" y="162" class="h">Departmental VMS (5 vendors)</text>
  <text x="725" y="186" class="s">Hikvision · Milestone · CP-Plus · Genetec · ONVIF</text>
  <text x="725" y="203" class="s">Existing systems keep running — never replaced</text>

  <!-- ============= INGEST & FEDERATION ============= -->
  <text x="40" y="266" class="tier">INGEST &amp; FEDERATION</text>
  <rect x="180" y="276" width="470" height="92" rx="12" class="box"/>
  <rect x="180" y="276" width="6" height="92" rx="3" fill="#10214B"/>
  <text x="205" y="310" class="h">Ingest Service — RTSP → JPEG</text>
  <text x="205" y="334" class="s">No ML. Bounded, cap-safe pool holds N streams live,</text>
  <text x="205" y="351" class="s">decodes a frame per interval, publishes to Redis.</text>

  <rect x="700" y="276" width="520" height="92" rx="12" class="box"/>
  <rect x="700" y="276" width="6" height="92" rx="3" fill="#10214B"/>
  <text x="725" y="310" class="h">VMS Adapter Framework</text>
  <text x="725" y="334" class="s">Pluggable per-vendor adapters → common interface →</text>
  <text x="725" y="351" class="s">metadata exchange bus (one class onboards a vendor).</text>

  <!-- ================= CORE PLATFORM ================= -->
  <text x="40" y="420" class="tier">CORE PLATFORM</text>
  <rect x="180" y="430" width="300" height="120" rx="12" class="box"/>
  <rect x="180" y="430" width="6" height="120" rx="3" fill="#FF9933"/>
  <text x="205" y="464" class="h">Redis</text>
  <text x="205" y="488" class="s">Live frame keys</text>
  <text x="205" y="507" class="s">(short TTL) +</text>
  <text x="205" y="526" class="s">metadata bus</text>

  <rect x="520" y="430" width="400" height="120" rx="12" fill="#10214B" stroke="#10214B"/>
  <text x="545" y="464" font-size="15" font-weight="700" class="w">FastAPI Core</text>
  <text x="545" y="490" font-size="12" fill="#AEBBDD">Registry · Unified Viewing · VMS Federation</text>
  <text x="545" y="509" font-size="12" fill="#AEBBDD">+ deterministic correlation engine · Rule-based</text>
  <text x="545" y="528" font-size="12" fill="#AEBBDD">alerts · Auth / RBAC / Audit</text>

  <rect x="960" y="430" width="260" height="120" rx="12" class="box"/>
  <rect x="960" y="430" width="6" height="120" rx="3" fill="#138808"/>
  <text x="985" y="464" class="h">PostgreSQL</text>
  <text x="985" y="486" class="h" font-size="13">+ PostGIS</text>
  <text x="985" y="510" class="s">System of record:</text>
  <text x="985" y="528" class="s">registry, events,</text>
  <text x="985" y="546" class="s">alerts, audit</text>

  <!-- ================= PRESENTATION ================= -->
  <text x="40" y="602" class="tier">PRESENTATION</text>
  <rect x="180" y="612" width="1040" height="86" rx="12" class="box"/>
  <rect x="180" y="612" width="6" height="86" rx="3" fill="#10214B"/>
  <text x="205" y="646" class="h">React + Leaflet Command Console</text>
  <text x="205" y="672" class="s">Dashboard · Registry &amp; GIS map · Unified Viewing Wall (click-to-maximise) · VMS Federation · Security posture · Audit trail</text>

  <!-- ================= USERS ================= -->
  <text x="40" y="750" class="tier">USERS</text>
  <rect x="180" y="760" width="1040" height="72" rx="12" fill="#EEF2FB" stroke="#C9D3EA" stroke-width="1.5"/>
  <text x="205" y="792" class="h">Command Centre</text>
  <text x="205" y="814" class="s">Control-room operators · department &amp; station officers · statewide video walls — role-scoped access</text>

  <!-- ============ FLOW ARROWS ============ -->
  <!-- sources -> ingest/federation -->
  <path class="flow" d="M415,214 L415,276" marker-end="url(#arrow)"/>
  <path class="flow" d="M960,214 L960,276" marker-end="url(#arrow)"/>
  <!-- ingest -> redis ; adapters -> api -->
  <path class="flow" d="M330,368 L330,430" marker-end="url(#arrow)"/>
  <path class="flow" d="M760,368 L740,430" marker-end="url(#arrow)"/>
  <!-- redis <-> api ; api <-> db -->
  <path class="flow" d="M480,490 L520,490" marker-end="url(#arrow)"/>
  <path class="flow" d="M520,478 L480,478" marker-end="url(#arrow)"/>
  <path class="flow" d="M920,490 L960,490" marker-end="url(#arrow)"/>
  <path class="flow" d="M960,478 L920,478" marker-end="url(#arrow)"/>
  <!-- core -> presentation (JWT/REST) -->
  <path class="flow" d="M700,550 L700,612" marker-end="url(#arrow)"/>
  <text x="712" y="586" class="s" font-style="italic">JWT / REST</text>
  <!-- presentation -> users -->
  <path class="flow" d="M700,698 L700,760" marker-end="url(#arrow)"/>

  <!-- ============ SECURITY BAND ============ -->
  <rect x="180" y="856" width="1040" height="34" rx="8" fill="#FFF2E3" stroke="#F0D3AC" stroke-width="1.5"/>
  <text x="205" y="878" font-size="12.5" font-weight="700" fill="#D9741A">SECURITY ACROSS ALL TIERS</text>
  <text x="470" y="878" font-size="12.5" fill="#5B6372">JWT (HS256) · Department-wise RBAC · Brute-force lockout · Rate limiting · Security headers (CSP/HSTS) · Immutable audit trail</text>
</svg>
